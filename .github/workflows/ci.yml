name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Si llega un push nuevo mientras corre uno anterior de la misma rama, cancela el viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # El export estático es lo que se despliega en Cloudflare Pages: si no
      # compila aquí, no debe llegar a producción.
      - name: Build
        run: npm run build
